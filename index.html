<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal website of a teenage tech enthusiast passionate about cybersecurity and AI">
    <title>Tech Enthusiast | Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"></div>
            <ul class="nav-menu"></ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1 class="hero-title"></h1>
            <p class="hero-subtitle"></p>
            <a href="#" class="btn-primary"></a>
        </div>
    </section>

    <!-- About Section -->
    <section id="about" class="section about-section">
        <div class="container">
            <h2 class="section-title"></h2>
            <div class="about-content">
                <div class="about-paragraphs"></div>
                <div class="skills">
                    <h3></h3>
                    <ul class="skills-list"></ul>
                </div>
            </div>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="section projects-section">
        <div class="container">
            <h2 class="section-title"></h2>
            <div class="projects-grid"></div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section contact-section">
        <div class="container">
            <h2 class="section-title"></h2>
            <p class="contact-intro"></p>
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name"></label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email"></label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message"></label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn-primary"></button>
            </form>
            <div id="formMessage" class="form-message"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p></p>
        </div>
    </footer>

    <script src="content.js"></script>
    <script src="script.js"></script>
</body>
</html>
